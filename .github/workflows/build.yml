name: Build Image Viewer OS

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib nasm grub-pc-bin grub-common xorriso mtools
    
    - name: Create test image (if no sky.bmp)
      run: |
        if [ ! -f sky.bmp ]; then
          echo "Creating test image..."
          # Download or create a placeholder
          python3 -c "
          import struct
          # Create minimal 640x480 256-color BMP
          with open('sky.bmp', 'wb') as f:
              # BMP header
              f.write(b'BM')
              f.write(struct.pack('<I', 54 + 1024 + 640*480))  # file size
              f.write(struct.pack('<HH', 0, 0))
              f.write(struct.pack('<I', 54 + 1024))  # data offset
              # DIB header
              f.write(struct.pack('<I', 40))  # header size
              f.write(struct.pack('<i', 640))  # width
              f.write(struct.pack('<i', 480))  # height
              f.write(struct.pack('<H', 1))    # planes
              f.write(struct.pack('<H', 8))    # bpp
              f.write(struct.pack('<I', 0))    # compression
              f.write(struct.pack('<I', 640*480))  # image size
              f.write(struct.pack('<i', 2835))  # x pixels/meter
              f.write(struct.pack('<i', 2835))  # y pixels/meter
              f.write(struct.pack('<I', 256))   # colors used
              f.write(struct.pack('<I', 0))     # important colors
              # Palette (blue to white gradient)
              for i in range(256):
                  f.write(bytes([i, i//2, 255-i, 0]))
              # Pixel data (bottom-up)
              for y in range(479, -1, -1):
                  for x in range(640):
                      f.write(bytes([(x + y) % 256]))
          "
        fi
    
    - name: Build
      run: make
    
    - name: Upload ISO
      uses: actions/upload-artifact@v3
      with:
        name: image-viewer-os
        path: image-viewer.iso

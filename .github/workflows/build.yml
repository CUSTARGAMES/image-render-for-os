name: Build Image Viewer OS

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-multilib \
          nasm \
          grub-pc-bin \
          grub-common \
          xorriso \
          mtools \
          grub2-common
    
    - name: Create test image (if no sky.bmp)
      run: |
        if [ ! -f sky.bmp ]; then
          echo "Creating test 640x480 256-color BMP..."
          python3 -c "
          import struct
          width, height = 640, 480
          with open('sky.bmp', 'wb') as f:
              # File header
              data_offset = 54 + 256 * 4
              file_size = data_offset + width * height
              f.write(b'BM')
              f.write(struct.pack('<I', file_size))
              f.write(struct.pack('<HH', 0, 0))
              f.write(struct.pack('<I', data_offset))
              # Info header
              f.write(struct.pack('<I', 40))
              f.write(struct.pack('<i', width))
              f.write(struct.pack('<i', height))
              f.write(struct.pack('<H', 1))
              f.write(struct.pack('<H', 8))
              f.write(struct.pack('<I', 0))
              f.write(struct.pack('<I', width * height))
              f.write(struct.pack('<i', 2835))
              f.write(struct.pack('<i', 2835))
              f.write(struct.pack('<I', 256))
              f.write(struct.pack('<I', 256))
              # Palette
              for i in range(256):
                  f.write(bytes([i//2, i//3 + 50, i, 0]))
              # Pixels (bottom-up)
              for y in range(height - 1, -1, -1):
                  row = bytes([(x + y) % 256 for x in range(width)])
                  f.write(row)
          "
          ls -la sky.bmp
        fi
    
    - name: Build ISO
      run: |
        make
        ls -la image-viewer.iso
        # Verify ISO is bootable
        file image-viewer.iso
    
    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: image-viewer-os
        path: image-viewer.iso
        retention-days: 30
